extends:
  - global-context.yaml

project:
  client_name: SampleClient
  project_name: SampleProject
  domain: sample-domain
  tech_stack:
    - azure
    - databricks
    - sql-server
  qa_frameworks:
    - risk-based-testing
    - rca
  standards:
    - HIPAA
    - deterministic-sql

severity_model:
  critical: 5
  high: 4
  medium: 3
  low: 2
  info: 1

defect_taxonomy:
  - data-quality
  - business-rule
  - integration
  - performance
  - security
  - test-automation

manual_bottlenecks:
  - defect triage note drafting
  - repetitive rca for recurring data issues
  - inconsistent capa format

success_metrics:
  target_triage_time_reduction_percent: 30
  target_reopen_rate_reduction_percent: 20
  target_repeat_defect_reduction_percent: 25

quality_gates_file: quality-gates.template.yaml

agentic:
  min_confidence_to_autosuggest: 0.72
  confidence_calibration:
    missing_field_penalty: 0.09
    short_text_penalty: 0.07
    strong_repro_bonus: 0.05
  prioritization_weights:
    risk: 0.70
    uncertainty: 0.20
    repeat_signal: 0.10
  priority_tiers:
    high_min: 76
    medium_min: 52
  rca:
    method: five-whys
    min_hypothesis_support: 0.70
    require_5whys_before_capa: true
    require_evidence_artifact_for_capa: true
    min_artifact_quality_score: 0.70
    require_artifact_traceability: true
    require_capa_validation_experiment: true
    interactive:
      min_depth: 1
      target_depth: 5
      max_depth: 8
      min_answer_length: 25
      min_evidence_items: 1
    outcome_evaluation:
      min_sample_size: 5
      default_target_reduction_percent: 20
      effective_threshold: 82
      partial_threshold: 62
      weight_target: 0.70
      weight_regression: 0.20
      weight_sample: 0.10

